[project]
name = "pgis-bodyweight"
version = "0.1.0"
description = "Glucose-aware bodyweight training engine for the PGIS platform"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "fastapi[standard]>=0.100",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "anthropic>=0.50",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx2>=2"]

[tool.pytest.ini_options]
testpaths = ["pgis_bodyweight/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
