# Pull pattern — progression ladder
#
# Single track (no joint-flag variant at Phase 1).
# REVIEW: physician must confirm whether JointFlag.SHOULDER triggers a
# modified track (e.g. exclude inverted_row; use only band-resisted rows
# in a pain-free range).

levels:
  - level: 1
    exercise_id: band_row
    sets: 2
    reps_or_time: "10 reps"
    rest_s: 60
    target_rpe: 5.0
    regression_alt: seated_row_isometric
    progression_alt: door_row

  - level: 2
    exercise_id: door_row
    sets: 2
    reps_or_time: "10 reps"
    rest_s: 60
    target_rpe: 6.0
    regression_alt: band_row
    progression_alt: incline_row

  - level: 3
    exercise_id: incline_row
    sets: 3
    reps_or_time: "10 reps"
    rest_s: 60
    target_rpe: 7.0
    regression_alt: door_row
    progression_alt: inverted_row
