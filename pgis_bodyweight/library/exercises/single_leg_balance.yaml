# Single-leg balance pattern — progression ladders
#
# Two tracks:
#   levels    — standard track
#   hip_safe  — JointFlag.HIP; caps unilateral hinge progression by replacing
#               single_leg_deadlift with tandem_walk as L3 progression_alt
#               (physician decision 2026-06-10)
#
# Balance level thresholds (patterns.py): <5 s → L1, 5–9 s → L2, ≥10 s → L3.
# Citations: Vellas et al. 1997 (<5 s / injurious falls); Bohannon et al. 2006
# (10 s / fall risk and mortality). Confirmed by physician 2026-06-10.

levels:
  - level: 1
    exercise_id: single_leg_stand_assist
    sets: 2
    reps_or_time: "20 s per side"
    rest_s: 60
    target_rpe: 4.0
    regression_alt: seated_heel_raise
    progression_alt: single_leg_stand

  - level: 2
    exercise_id: single_leg_stand
    sets: 2
    reps_or_time: "30 s per side"
    rest_s: 60
    target_rpe: 5.0
    regression_alt: single_leg_stand_assist
    progression_alt: single_leg_balance_reach

  - level: 3
    exercise_id: single_leg_balance_reach
    sets: 3
    reps_or_time: "10 reps per side"
    rest_s: 60
    target_rpe: 6.0
    regression_alt: single_leg_stand
    progression_alt: single_leg_deadlift

hip_safe:
  - level: 1
    exercise_id: single_leg_stand_assist
    sets: 2
    reps_or_time: "20 s per side"
    rest_s: 60
    target_rpe: 4.0
    regression_alt: seated_heel_raise
    progression_alt: single_leg_stand

  - level: 2
    exercise_id: single_leg_stand
    sets: 2
    reps_or_time: "30 s per side"
    rest_s: 60
    target_rpe: 5.0
    regression_alt: single_leg_stand_assist
    progression_alt: single_leg_balance_reach

  - level: 3
    exercise_id: single_leg_balance_reach
    sets: 3
    reps_or_time: "10 reps per side"
    rest_s: 60
    target_rpe: 6.0
    regression_alt: single_leg_stand
    progression_alt: tandem_walk
